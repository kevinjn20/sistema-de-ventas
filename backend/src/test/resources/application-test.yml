spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: test-secreto-de-al-menos-32-caracteres-para-tests-1234567890
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173
  admin:
    username: admin
    password: admin123
  dashboard:
    stock-minimo: 5

logging:
  level:
    org.hibernate.SQL: WARN
